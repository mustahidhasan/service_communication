<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfefd" />
      <stop offset="80%" stop-color="#f3f9f4" />
    </linearGradient>
    <style>
      .title { font: 32px 'Segoe UI', sans-serif; fill: #1b6b3a; font-weight: 600; }
      .subtitle { font: 18px 'Segoe UI', sans-serif; fill: #4a6d4e; }
      .nav { font: 16px 'Segoe UI', sans-serif; fill: #19592d; font-weight: 600; }
      .card-title { font: 18px 'Segoe UI', sans-serif; fill: #2d5334; font-weight: 600; }
      .card-value { font: 48px 'Segoe UI', sans-serif; fill: #1b6b3a; font-weight: 700; }
      .label { font: 16px 'Segoe UI', sans-serif; fill: #355133; }
      .body { font: 14px 'Segoe UI', sans-serif; fill: #4c5c4d; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)" />
  <rect x="70" y="40" width="1460" height="120" rx="28" fill="#ffffff" stroke="#d4e8d9" />
  <text x="120" y="105" class="title">Service Communications</text>
  <text x="120" y="135" class="subtitle">Fast access to incidents, messaging and distribution lists</text>
  <rect x="1180" y="60" width="300" height="80" rx="40" fill="#f3f9f4" stroke="#d4e8d9" />
  <circle cx="1225" cy="100" r="32" fill="#1b6b3a" />
  <text x="1210" y="109" font-size="20" font-family="'Segoe UI', sans-serif" fill="#ffffff" font-weight="600">AB</text>
  <text x="1265" y="98" class="label">Alex Byrne</text>
  <text x="1265" y="120" class="body">alex@network.co</text>

  <rect x="70" y="180" width="1460" height="60" rx="16" fill="#ffffff" stroke="#d4e8d9" />
  <text x="110" y="218" class="nav">Overview</text>
  <text x="250" y="218" class="nav">Teams &amp; Templates</text>
  <text x="485" y="218" class="nav">Create Incident</text>
  <text x="680" y="218" class="nav">Active Incidents</text>
  <text x="900" y="218" class="nav">Messaging</text>
  <text x="1100" y="218" class="nav">Distribution Lists</text>
  <rect x="92" y="188" width="140" height="44" rx="12" fill="#1b6b3a" />
  <text x="115" y="218" class="nav" fill="#ffffff">Overview</text>

  <rect x="70" y="260" width="720" height="220" rx="28" fill="#ffffff" stroke="#d4e8d9" />
  <text x="110" y="310" class="card-title">Open Incidents</text>
  <text x="110" y="380" class="card-value">3</text>
  <circle cx="380" cy="360" r="90" fill="#f5fbf7" stroke="#d4e8d9" />
  <text x="340" y="370" class="card-title">SLA</text>
  <text x="340" y="405" class="body">Next update in 42m</text>

  <rect x="820" y="260" width="710" height="220" rx="28" fill="#ffffff" stroke="#d4e8d9" />
  <text x="860" y="310" class="card-title">Recent Messages</text>
  <text x="860" y="345" class="body">• Edge latency update &nbsp;&nbsp;• Region India brief</text>
  <text x="860" y="375" class="body">• Africa deployment note &nbsp;&nbsp;• Customer alert prep</text>
  <rect x="860" y="395" width="260" height="48" rx="16" fill="#1b6b3a" />
  <text x="890" y="425" class="nav" fill="#ffffff">Create New Incident</text>
  <rect x="1150" y="395" width="260" height="48" rx="16" fill="#ffffff" stroke="#1b6b3a" />
  <text x="1180" y="425" class="nav">Active Incidents</text>

  <rect x="70" y="500" width="460" height="320" rx="24" fill="#ffffff" stroke="#d4e8d9" />
  <text x="110" y="550" class="card-title">Teams &amp; Templates</text>
  <text x="110" y="585" class="body">Team Alpha • Team Infra</text>
  <text x="110" y="615" class="label">Templates</text>
  <text x="110" y="645" class="body">• Major Incident • Scheduled Maintenance • Informational</text>

  <rect x="560" y="500" width="970" height="150" rx="24" fill="#ffffff" stroke="#d4e8d9" />
  <text x="600" y="545" class="card-title">Incident Builder</text>
  <text x="600" y="580" class="body">INC Number • Subject • Impact • Regions • Next Communication</text>
  <text x="600" y="610" class="body">Inputs sit side-by-side to minimize scrolling while keeping clarity.</text>

  <rect x="560" y="670" width="460" height="150" rx="24" fill="#ffffff" stroke="#d4e8d9" />
  <text x="600" y="715" class="card-title">Active Incidents</text>
  <text x="600" y="750" class="body">INC-134 • Major • Monitoring</text>
  <text x="600" y="780" class="body">INC-142 • Critical • Mitigating</text>

  <rect x="1060" y="670" width="470" height="150" rx="24" fill="#ffffff" stroke="#d4e8d9" />
  <text x="1100" y="715" class="card-title">Message Timeline</text>
  <text x="1100" y="750" class="body">Status updates, attachments and next communication controls.</text>
</svg>
