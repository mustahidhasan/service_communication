services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: logic_monitor-backend
    env_file:
      - .env.prod.be
    volumes:
      - ./staticfiles:/app/staticfiles  # Django static files
    ports:
      - "8000:8000"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        ENV_FILE: .env.prod.fe
    image: logic_monitor-frontend
    container_name: logic_monitor-frontend
    depends_on:
      - backend
    # no volumes needed; build is inside Docker

  nginx:
    image: logic_monitor-frontend
    container_name: logic_monitor-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    volumes:
      # Only mount config and SSL, NOT the build folder
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
      - ../certs:/etc/ssl/private:ro
      - ./staticfiles:/app/staticfiles
    restart: always

  redis:
    image: redis:latest
    container_name: logic_monitor-redis
    ports:
      - "6379:6379"
